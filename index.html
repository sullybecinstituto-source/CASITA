<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sullybec - Finanzas Hogar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; }
        .btn-touch { min-height: 48px; display: flex; align-items: center; justify-content: center; }
        /* Ocultar scrollbar pero permitir scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-20"> <!-- Espacio inferior para que el teclado no tape todo -->
    <div class="max-w-md mx-auto px-4 pt-6">
        
        <!-- Header Compacto Móvil -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-black text-slate-800">Mi Casa 🏠</h1>
                <p class="text-xs text-slate-500 font-medium">Presupuesto Personal</p>
            </div>
            <div class="text-right">
                <span class="text-[10px] text-slate-400 font-bold uppercase block">Disponible</span>
                <span id="saldo-total" class="text-xl font-black text-indigo-600">$0.00</span>
            </div>
        </header>

        <!-- Resumen de Meta (Sueldo Casa) -->
        <section class="glass-card p-5 mb-6 shadow-sm border-b-4 border-b-indigo-500">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-slate-700">Meta Gasto Básico</h3>
                <button onclick="configurarPresupuesto()" class="text-indigo-600 text-[11px] font-bold">AJUSTAR</button>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-3 mb-2">
                <div id="barra-presupuesto" class="bg-indigo-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <div class="flex justify-between text-[11px] font-bold uppercase">
                <span class="text-slate-400">Gastado: <span id="gasto-actual" class="text-slate-700">$0</span></span>
                <span class="text-slate-400">Meta: <span id="limite-presupuesto" class="text-slate-700">$0</span></span>
            </div>
        </section>

        <!-- Botones de Respaldo -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button onclick="exportarExcel()" class="btn-touch bg-white text-slate-700 border border-slate-200 rounded-2xl text-xs font-bold shadow-sm">
                📥 Descargar Respaldo
            </button>
            <label class="btn-touch bg-white text-slate-700 border border-slate-200 rounded-2xl text-xs font-bold shadow-sm cursor-pointer relative">
                📤 Subir Respaldo
                <input type="file" id="import-file" class="absolute inset-0 opacity-0 cursor-pointer" accept=".csv">
            </label>
        </div>

        <!-- Formulario Registro -->
        <div class="glass-card p-5 mb-6 shadow-sm">
            <form id="form-transaccion" class="space-y-4">
                <input type="text" id="desc" placeholder="¿Qué compraste hoy?" class="w-full btn-touch px-4 rounded-xl bg-slate-50 border-transparent focus:border-indigo-500 focus:bg-white outline-none text-sm transition-all" required>
                
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="monto" placeholder="Monto $" class="w-full btn-touch px-4 rounded-xl bg-slate-50 border-transparent focus:border-indigo-500 focus:bg-white outline-none text-sm font-bold" required>
                    <select id="tipo" class="w-full btn-touch px-4 rounded-xl bg-slate-50 border-transparent outline-none text-sm font-bold">
                        <option value="egreso">Gasto</option>
                        <option value="ingreso">Sueldo/Entrada</option>
                        <option value="emergencia">Ahorro</option>
                    </select>
                </div>

                <select id="categoria" class="w-full btn-touch px-4 rounded-xl bg-slate-50 border-transparent outline-none text-sm">
                    <option value="Despensa">🛒 Despensa / Comida</option>
                    <option value="Servicios">💡 Luz / Agua / Gas</option>
                    <option value="Renta">🏠 Renta / Hipoteca</option>
                    <option value="Transporte">🚌 Transporte / Gasolina</option>
                    <option value="Personal">✨ Personal / Salud</option>
                    <option value="Deudas">💳 Pago Tarjeta</option>
                </select>

                <button type="submit" class="w-full btn-touch bg-indigo-600 text-white rounded-2xl font-black text-sm shadow-lg shadow-indigo-100 uppercase tracking-wider">Guardar Movimiento</button>
            </form>
        </div>

        <!-- Deudas y Gráfica -->
        <div class="space-y-6">
            <div class="glass-card p-5 shadow-sm">
                <h3 class="text-sm font-black text-slate-800 uppercase mb-4 tracking-tighter">Deudas del Hogar</h3>
                <div id="lista-deudas" class="space-y-3"></div>
                <div class="mt-4 pt-4 border-t flex justify-between items-center">
                    <span class="text-[10px] font-bold text-slate-400">Total Deuda:</span>
                    <span id="total-deudas-num" class="text-lg font-black text-red-500">$0.00</span>
                </div>
                <button onclick="document.getElementById('modal-deuda').classList.toggle('hidden')" class="w-full mt-4 py-2 border-2 border-dashed border-slate-200 rounded-xl text-xs font-bold text-slate-400">+ Añadir Tarjeta</button>
            </div>

            <div class="glass-card p-5 shadow-sm flex flex-col items-center">
                <h3 class="text-[10px] font-bold text-slate-400 uppercase mb-4">¿En qué se va el dinero?</h3>
                <div class="h-48 w-full">
                    <canvas id="chartCategorias"></canvas>
                </div>
            </div>

            <!-- Historial -->
            <div class="glass-card p-5 shadow-sm overflow-hidden">
                <h3 class="text-sm font-black text-slate-800 uppercase mb-4">Últimos Movimientos</h3>
                <div class="overflow-x-auto no-scrollbar">
                    <table class="w-full text-xs">
                        <tbody id="tabla-movimientos" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DEUDA (OCULTO POR DEFECTO) -->
    <div id="modal-deuda" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6">
            <h2 class="text-lg font-bold mb-4">Añadir Deuda</h2>
            <form id="form-deuda" class="space-y-3">
                <input type="text" id="nombre-deuda" placeholder="Nombre (Ej: Visa)" class="w-full p-3 bg-slate-100 rounded-xl outline-none" required>
                <input type="number" id="monto-deuda" placeholder="Saldo Actual $" class="w-full p-3 bg-slate-100 rounded-xl outline-none" required>
                <input type="number" id="tasa-deuda" placeholder="Tasa % Anual" class="w-full p-3 bg-slate-100 rounded-xl outline-none" required>
                <input type="number" id="dia-pago" placeholder="Día de corte (1-31)" class="w-full p-3 bg-slate-100 rounded-xl outline-none" required>
                <div class="flex gap-2">
                    <button type="button" onclick="document.getElementById('modal-deuda').classList.add('hidden')" class="flex-1 p-3 text-slate-400 font-bold">Cerrar</button>
                    <button type="submit" class="flex-1 p-3 bg-red-500 text-white rounded-xl font-bold">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, setDoc, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRFAaPl2d1ZTy_ZE6uZEpHrffr63MN5Qc",
            authDomain: "mis-finanzas-hogar-8a7b8.firebaseapp.com",
            projectId: "mis-finanzas-hogar-8a7b8",
            storageBucket: "mis-finanzas-hogar-8a7b8.firebasestorage.app",
            messagingSenderId: "573199459213",
            appId: "1:573199459213:web:123f617fbc52874b7493c4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const formTrans = document.getElementById('form-transaccion');
        const formDeuda = document.getElementById('form-deuda');
        const tablaBody = document.getElementById('tabla-movimientos');
        const listaDeudasUI = document.getElementById('lista-deudas');
        let myChart;
        let presupuestoLimite = 0;
        let todosLosMovimientos = [];

        // Cargar Configuración Inicial
        async function cargarConfig() {
            const docRef = doc(db, "config", "presupuesto");
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                presupuestoLimite = docSnap.data().limite;
                document.getElementById('limite-presupuesto').innerText = `$${presupuestoLimite.toLocaleString()}`;
            }
        }
        cargarConfig();

        window.configurarPresupuesto = async () => {
            const nuevo = prompt("¿Cuánto es lo MÍNIMO que necesitas para gastos de casa este mes?", presupuestoLimite);
            if (nuevo) {
                presupuestoLimite = Number(nuevo);
                await setDoc(doc(db, "config", "presupuesto"), { limite: presupuestoLimite });
                location.reload();
            }
        };

        // Guardar Transacción
        formTrans.addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "transacciones"), {
                desc: document.getElementById('desc').value,
                monto: Number(document.getElementById('monto').value),
                tipo: document.getElementById('tipo').value,
                categoria: document.getElementById('categoria').value,
                fecha: new Date().toISOString()
            });
            formTrans.reset();
        });

        // Guardar Deuda
        formDeuda.addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "deudas"), {
                nombre: document.getElementById('nombre-deuda').value,
                monto: Number(document.getElementById('monto-deuda').value),
                tasa: Number(document.getElementById('tasa-deuda').value),
                diaPago: Number(document.getElementById('dia-pago').value),
                fecha: new Date().toISOString()
            });
            formDeuda.reset();
            document.getElementById('modal-deuda').classList.add('hidden');
        });

        // Escuchar Transacciones
        onSnapshot(query(collection(db, "transacciones"), orderBy("fecha", "desc")), (snap) => {
            let html = ""; let bal = 0; let totalGastos = 0; let catData = {};
            todosLosMovimientos = [];
            
            snap.forEach(d => {
                const item = d.data();
                todosLosMovimientos.push({id: d.id, ...item});
                if(item.tipo === 'egreso') {
                    bal -= item.monto;
                    totalGastos += item.monto;
                    catData[item.categoria] = (catData[item.categoria] || 0) + item.monto;
                } else if(item.tipo === 'ingreso') {
                    bal += item.monto;
                } else if(item.tipo === 'emergencia') {
                    bal -= item.monto;
                }

                html += `<tr>
                    <td class="py-4"><span class="font-bold text-slate-700">${item.desc}</span><br><span class="text-[9px] font-bold text-slate-400 uppercase">${item.categoria}</span></td>
                    <td class="py-4 text-right font-black ${item.tipo==='egreso'?'text-red-500':'text-emerald-500'}">
                        ${item.tipo==='egreso'?'-':'+'}$${item.monto.toLocaleString()}
                    </td>
                    <td class="pl-4 text-right"><button onclick="window.eliminar('${d.id}', 'transacciones')" class="text-slate-200">✕</button></td>
                </tr>`;
            });
            
            tablaBody.innerHTML = html;
            document.getElementById('saldo-total').innerText = `$${bal.toLocaleString()}`;
            document.getElementById('gasto-actual').innerText = `$${totalGastos.toLocaleString()}`;
            
            const porc = presupuestoLimite > 0 ? (totalGastos / presupuestoLimite) * 100 : 0;
            const barra = document.getElementById('barra-presupuesto');
            barra.style.width = Math.min(porc, 100) + '%';
            if(porc > 100) barra.classList.replace('bg-indigo-500', 'bg-red-500');

            actualizarGrafica(catData);
        });

        // Escuchar Deudas
        onSnapshot(collection(db, "deudas"), (snap) => {
            let total = 0; let html = "";
            snap.forEach(d => {
                const item = d.data();
                total += item.monto;
                html += `
                <div class="p-3 bg-slate-50 rounded-xl flex justify-between items-center border border-slate-100">
                    <div class="flex-1">
                        <p class="font-bold text-slate-800 text-xs">${item.nombre.toUpperCase()}</p>
                        <p class="text-[9px] text-slate-400 font-bold uppercase">Corte: Día ${item.diaPago}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-black text-slate-800 text-sm">$${item.monto.toLocaleString()}</p>
                        <button onclick="window.eliminar('${d.id}', 'deudas')" class="text-[9px] text-slate-300 font-bold uppercase">Eliminar</button>
                    </div>
                </div>`;
            });
            listaDeudasUI.innerHTML = html || "<p class='text-center text-slate-300 text-[10px]'>Sin deudas</p>";
            document.getElementById('total-deudas-num').innerText = `$${total.toLocaleString()}`;
        });

        // EXPORTAR A EXCEL (CSV)
        window.exportarExcel = () => {
            if(todosLosMovimientos.length === 0) return alert("No hay datos para exportar");
            const headers = "fecha,desc,monto,tipo,categoria\n";
            const rows = todosLosMovimientos.map(m => `${m.fecha},"${m.desc}",${m.monto},${m.tipo},${m.categoria}`).join("\n");
            const blob = new Blob([headers + rows], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `Respaldo_Hogar_${new Date().toLocaleDateString()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // IMPORTAR DESDE EXCEL (CSV)
        document.getElementById('import-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                const text = e.target.result;
                const lines = text.split("\n").slice(1); // Saltar headers
                const batch = writeBatch(db);
                
                let importCount = 0;
                for(let line of lines) {
                    if(!line.trim()) continue;
                    const [fecha, desc, monto, tipo, categoria] = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(desc && monto) {
                        const newDocRef = doc(collection(db, "transacciones"));
                        batch.set(newDocRef, {
                            fecha: fecha.replace(/"/g, ""),
                            desc: desc.replace(/"/g, ""),
                            monto: Number(monto),
                            tipo: tipo.replace(/"/g, ""),
                            categoria: categoria.replace(/"/g, "").trim()
                        });
                        importCount++;
                    }
                }
                
                if(importCount > 0) {
                    await batch.commit();
                    alert(`¡Éxito! Se importaron ${importCount} movimientos.`);
                }
            };
            reader.readAsText(file);
        });

        window.eliminar = async (id, col) => { if(confirm("¿Eliminar?")) await deleteDoc(doc(db, col, id)); };

        function actualizarGrafica(data) {
            const ctx = document.getElementById('chartCategorias').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(data),
                    datasets: [{ data: Object.values(data), backgroundColor: ['#6366f1', '#f43f5e', '#10b981', '#f59e0b', '#8b5cf6'], borderWeight: 0 }]
                },
                options: { 
                    plugins: { legend: { display: true, position: 'bottom', labels: { boxWidth: 8, font: { size: 9, weight: 'bold' } } } },
                    cutout: '80%', 
                    maintainAspectRatio: false 
                }
            });
        }
    </script>
</body>
</html>
