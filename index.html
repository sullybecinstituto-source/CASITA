<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sullybec - Finanzas Hogar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; }
        .btn-touch { min-height: 48px; display: flex; align-items: center; justify-content: center; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .nav-active { color: #4f46e5; border-top: 3px solid #4f46e5; }
        
        /* Botón de eliminar optimizado para respuesta inmediata */
        .btn-delete { 
            background-color: #fee2e2; 
            color: #ef4444; 
            width: 36px; 
            height: 36px; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-weight: bold;
            transition: all 0.2s;
            border: 1px solid #fecaca;
        }
        .btn-delete:active {
            transform: scale(0.9);
            background-color: #fca5a5;
        }
    </style>
</head>
<body class="pb-24">
    
    <!-- CONTENIDO PRINCIPAL -->
    <div id="view-resumen" class="view-content max-w-md mx-auto px-4 pt-6">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-black text-slate-800">Mi Casa 🏠</h1>
                <p class="text-xs text-slate-500 font-medium">Control de Gastos</p>
            </div>
            <div class="text-right">
                <span class="text-[10px] text-slate-400 font-bold uppercase block">Saldo Actual</span>
                <span id="saldo-total" class="text-xl font-black text-indigo-600">$0.00</span>
            </div>
        </header>

        <!-- Meta Dinámica -->
        <section class="glass-card p-5 mb-6 shadow-sm border-b-4 border-b-indigo-500">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-slate-700">Meta Mensual (Auto)</h3>
                <span class="text-[10px] bg-indigo-50 text-indigo-600 px-2 py-1 rounded-lg font-bold">CALCULADO</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-3 mb-2">
                <div id="barra-presupuesto" class="bg-indigo-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <div class="flex justify-between text-[11px] font-bold uppercase">
                <span class="text-slate-400">Gastado: <span id="gasto-actual" class="text-slate-700">$0</span></span>
                <span class="text-slate-400">Meta: <span id="limite-presupuesto" class="text-slate-700">$0</span></span>
            </div>
        </section>

        <!-- Registro Rápido -->
        <div class="glass-card p-5 mb-6 shadow-sm">
            <form id="form-transaccion" class="space-y-4">
                <input type="text" id="desc" placeholder="¿En qué gastaste?" class="w-full btn-touch px-4 rounded-xl bg-slate-50 border-transparent focus:border-indigo-500 outline-none text-sm" required>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="monto" placeholder="Monto $" class="w-full btn-touch px-4 rounded-xl bg-slate-50 border-transparent outline-none text-sm font-bold" required>
                    <select id="tipo" class="w-full btn-touch px-4 rounded-xl bg-slate-50 border-transparent outline-none text-sm font-bold">
                        <option value="egreso">Gasto</option>
                        <option value="ingreso">Sueldo / Entrada</option>
                    </select>
                </div>
                <select id="categoria" class="w-full btn-touch px-4 rounded-xl bg-slate-50 border-transparent outline-none text-sm">
                    <option value="Despensa">🛒 Despensa / Comida</option>
                    <option value="Servicios">💡 Luz / Agua / Internet</option>
                    <option value="Renta">🏠 Renta / Casa</option>
                    <option value="Transporte">🚌 Transporte</option>
                    <option value="Personal">✨ Personal / Otros</option>
                </select>
                <button type="submit" class="w-full btn-touch bg-indigo-600 text-white rounded-2xl font-black text-sm shadow-lg uppercase">Guardar Gasto</button>
            </form>
        </div>

        <!-- Historial Corto -->
        <div class="glass-card p-5 mb-6 shadow-sm">
            <h3 class="text-xs font-black text-slate-400 uppercase mb-4">Últimos Movimientos</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-xs">
                    <tbody id="tabla-movimientos" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>

        <!-- Respaldo -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button onclick="exportarExcel()" class="btn-touch bg-white text-slate-600 border border-slate-200 rounded-2xl text-[10px] font-bold shadow-sm">📥 Exportar CSV</button>
            <label class="btn-touch bg-white text-slate-600 border border-slate-200 rounded-2xl text-[10px] font-bold shadow-sm relative cursor-pointer text-center">
                📤 Importar CSV
                <input type="file" id="import-file" class="absolute inset-0 opacity-0 cursor-pointer" accept=".csv">
            </label>
        </div>
    </div>

    <!-- VISTA PLANIFICACIÓN -->
    <div id="view-plan" class="view-content hidden max-w-md mx-auto px-4 pt-6">
        <h2 class="text-xl font-black text-slate-800 mb-2">Gastos Fijos 📝</h2>
        <p class="text-xs text-slate-500 mb-6">Anota aquí lo que pagas cada mes.</p>

        <div class="glass-card p-5 mb-6 shadow-sm">
            <form id="form-fijo" class="space-y-3">
                <input type="text" id="fijo-desc" placeholder="Ej: Renta, Netflix..." class="w-full btn-touch px-4 rounded-xl bg-slate-50 outline-none text-sm" required>
                <div class="flex gap-2">
                    <input type="number" id="fijo-monto" placeholder="Monto $" class="flex-1 btn-touch px-4 rounded-xl bg-slate-50 outline-none text-sm font-bold" required>
                    <button type="submit" class="w-20 btn-touch bg-slate-800 text-white rounded-xl font-bold text-xl">+</button>
                </div>
            </form>
        </div>

        <div id="lista-fijos" class="space-y-3"></div>
        
        <div class="mt-8 p-6 bg-indigo-600 rounded-3xl text-white shadow-xl shadow-indigo-100">
            <p class="text-[10px] font-bold uppercase opacity-80 mb-1">Total Meta Mensual</p>
            <h3 id="total-fijos-num" class="text-3xl font-black">$0.00</h3>
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-100 h-16 flex justify-around items-center z-50">
        <button onclick="switchView('resumen')" id="nav-resumen" class="flex flex-col items-center gap-1 text-[10px] font-bold nav-active pt-2 flex-1 h-full">
            <span class="text-lg">📊</span> RESUMEN
        </button>
        <button onclick="switchView('plan')" id="nav-plan" class="flex flex-col items-center gap-1 text-[10px] font-bold text-slate-400 pt-2 flex-1 h-full">
            <span class="text-lg">📝</span> GASTOS FIJOS
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, setDoc, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRFAaPl2d1ZTy_ZE6uZEpHrffr63MN5Qc",
            authDomain: "mis-finanzas-hogar-8a7b8.firebaseapp.com",
            projectId: "mis-finanzas-hogar-8a7b8",
            storageBucket: "mis-finanzas-hogar-8a7b8.firebasestorage.app",
            messagingSenderId: "573199459213",
            appId: "1:573199459213:web:123f617fbc52874b7493c4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // NAVEGACIÓN
        window.switchView = (view) => {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active', 'text-slate-400'));
            document.getElementById(`view-${view}`).classList.remove('hidden');
            document.getElementById(`nav-${view}`).classList.add('nav-active');
            if(view === 'resumen') document.getElementById('nav-plan').classList.add('text-slate-400');
            else document.getElementById('nav-resumen').classList.add('text-slate-400');
        };

        let metaCalculada = 0;
        let todosLosMovimientos = [];

        // ELIMINAR (SIN CONFIRMACIÓN PARA EVITAR BLOQUEOS EN CANVAS)
        window.eliminar = async (id, col) => {
            try {
                await deleteDoc(doc(db, col, id));
            } catch (error) {
                console.error("Error:", error);
            }
        };

        // GASTOS FIJOS
        const formFijo = document.getElementById('form-fijo');
        formFijo.addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "gastosFijos"), {
                desc: document.getElementById('fijo-desc').value,
                monto: Number(document.getElementById('fijo-monto').value)
            });
            formFijo.reset();
        });

        onSnapshot(collection(db, "gastosFijos"), (snap) => {
            let total = 0; let html = "";
            snap.forEach(d => {
                const item = d.data();
                total += item.monto;
                html += `
                <div class="glass-card p-4 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-slate-800 text-sm">${item.desc}</p>
                        <p class="text-[10px] text-indigo-500 font-black">$${item.monto.toLocaleString()}</p>
                    </div>
                    <button onclick="window.eliminar('${d.id}', 'gastosFijos')" class="btn-delete">✕</button>
                </div>`;
            });
            document.getElementById('lista-fijos').innerHTML = html || "<p class='text-center text-slate-300 text-xs py-10'>Lista vacía</p>";
            document.getElementById('total-fijos-num').innerText = `$${total.toLocaleString()}`;
            document.getElementById('limite-presupuesto').innerText = `$${total.toLocaleString()}`;
            metaCalculada = total;
            actualizarBarra(document.getElementById('gasto-actual').innerText.replace('$', '').replace(',', ''));
        });

        // TRANSACCIONES
        const formTrans = document.getElementById('form-transaccion');
        formTrans.addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "transacciones"), {
                desc: document.getElementById('desc').value,
                monto: Number(document.getElementById('monto').value),
                tipo: document.getElementById('tipo').value,
                categoria: document.getElementById('categoria').value,
                fecha: new Date().toISOString()
            });
            formTrans.reset();
        });

        onSnapshot(query(collection(db, "transacciones"), orderBy("fecha", "desc")), (snap) => {
            let html = ""; let bal = 0; let totalGastos = 0;
            todosLosMovimientos = [];
            snap.forEach(d => {
                const item = d.data();
                todosLosMovimientos.push({id: d.id, ...item});
                if(item.tipo === 'egreso') {
                    bal -= item.monto;
                    totalGastos += item.monto;
                } else {
                    bal += item.monto;
                }
                html += `<tr>
                    <td class="py-3 font-bold text-slate-700">${item.desc}<br><span class="text-[8px] text-slate-400 uppercase">${item.categoria}</span></td>
                    <td class="py-3 text-right font-black ${item.tipo==='egreso'?'text-red-500':'text-emerald-500'}">
                        $${item.monto.toLocaleString()}
                    </td>
                    <td class="pl-4 text-right">
                        <button onclick="window.eliminar('${d.id}', 'transacciones')" class="btn-delete ml-auto">✕</button>
                    </td>
                </tr>`;
            });
            document.getElementById('tabla-movimientos').innerHTML = html;
            document.getElementById('saldo-total').innerText = `$${bal.toLocaleString()}`;
            document.getElementById('gasto-actual').innerText = `$${totalGastos.toLocaleString()}`;
            actualizarBarra(totalGastos);
        });

        function actualizarBarra(gastado) {
            const porc = metaCalculada > 0 ? (gastado / metaCalculada) * 100 : 0;
            const barra = document.getElementById('barra-presupuesto');
            barra.style.width = Math.min(porc, 100) + '%';
            barra.className = porc > 100 ? 'bg-red-500 h-3 rounded-full transition-all' : 'bg-indigo-500 h-3 rounded-full transition-all';
        }

        window.exportarExcel = () => {
            if(todosLosMovimientos.length === 0) return;
            const headers = "fecha,desc,monto,tipo,categoria\n";
            const rows = todosLosMovimientos.map(m => `${m.fecha},"${m.desc}",${m.monto},${m.tipo},${m.categoria}`).join("\n");
            const blob = new Blob([headers + rows], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `Respaldo_Casa.csv`);
            link.click();
        };

        document.getElementById('import-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async function(e) {
                const lines = e.target.result.split("\n").slice(1);
                const batch = writeBatch(db);
                lines.forEach(line => {
                    const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(parts.length >= 5) {
                        const ref = doc(collection(db, "transacciones"));
                        batch.set(ref, {
                            fecha: parts[0].replace(/"/g, ""),
                            desc: parts[1].replace(/"/g, ""),
                            monto: Number(parts[2]),
                            tipo: parts[3].replace(/"/g, ""),
                            categoria: parts[4].replace(/"/g, "").trim()
                        });
                    }
                });
                await batch.commit();
            };
            reader.readAsText(file);
        });

    </script>
</body>
</html>
