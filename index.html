<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sullybec - Paz Financiera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --bg-serenity: #faf9ff; /* Lavanda blanquecino */
            --lavender-soft: #e8e7ff;
            --lavender-deep: #6d67e4;
            --mint-calm: #d1fae5;
            --text-main: #474554;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-serenity); 
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent; 
        }

        /* Tarjetas con bordes extra redondeados y sombras de nube */
        .zen-card { 
            background: white; 
            border: 1px solid #f0efff;
            border-radius: 2rem; 
            box-shadow: 0 10px 25px -5px rgba(109, 103, 228, 0.05);
        }

        .balance-gradient {
            background: linear-gradient(135deg, #6d67e4 0%, #a099ff 100%);
            color: white;
            border-radius: 2.25rem;
            position: relative;
            overflow: hidden;
        }

        /* Inputs ultra suaves */
        .input-zen {
            background-color: #f3f2ff;
            border: 1.5px solid transparent;
            border-radius: 1.25rem;
            padding: 1rem;
            font-size: 0.875rem;
            width: 100%;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-zen:focus {
            background-color: white;
            border-color: var(--lavender-soft);
            box-shadow: 0 0 0 4px rgba(109, 103, 228, 0.1);
        }

        /* Botón Lavanda */
        .btn-zen-primary {
            background-color: var(--lavender-deep);
            color: white;
            border-radius: 1.25rem;
            font-weight: 700;
            font-size: 0.875rem;
            padding: 1.1rem;
            width: 100%;
            box-shadow: 0 10px 20px -5px rgba(109, 103, 228, 0.4);
            transition: all 0.3s;
        }

        .btn-zen-primary:active { transform: scale(0.96); }

        .btn-delete { 
            color: #ffa1a1; 
            padding: 0.5rem;
            font-weight: 800;
            transition: color 0.2s;
        }
        
        .btn-delete:hover { color: #f87171; }

        /* Estilo para botones de backup */
        .btn-backup {
            background: white;
            border: 1px solid var(--lavender-soft);
            padding: 0.5rem 0.8rem;
            border-radius: 0.8rem;
            font-size: 0.65rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--lavender-deep);
            transition: all 0.2s;
        }
        .btn-backup:active { transform: scale(0.95); background: var(--lavender-soft); }

        /* Navegación */
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #b0aec3;
            font-weight: 700;
            font-size: 0.65rem;
            gap: 4px;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: var(--lavender-deep);
        }

        .nav-indicator {
            width: 20px;
            height: 4px;
            background: transparent;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .active .nav-indicator {
            background: var(--lavender-deep);
            width: 24px;
        }

        /* Animación de entrada */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="pb-32">
    
    <!-- VISTA 1: RESUMEN -->
    <div id="view-resumen" class="view-content max-w-md mx-auto px-6 pt-10 fade-in">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-extrabold tracking-tight">Todo está bien ✨</h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Sullybec, respira y fluye</p>
            </div>
            <div class="w-11 h-11 rounded-2xl bg-white shadow-sm border border-lavender-soft flex items-center justify-center font-bold text-sm text-indigo-400">SB</div>
        </div>

        <!-- Botones de Respaldo Excel -->
        <div class="flex gap-2 mb-6">
            <button onclick="exportarExcel()" class="btn-backup">
                <span>📥</span> Guardar Excel
            </button>
            <label class="btn-backup cursor-pointer">
                <span>📤</span> Subir Excel
                <input type="file" id="importExcel" accept=".xlsx, .xls" class="hidden" onchange="importarExcel(event)">
            </label>
        </div>

        <!-- Tarjeta de Saldo Principal -->
        <div class="balance-gradient p-8 mb-10 shadow-xl shadow-indigo-100">
            <div class="flex justify-between items-start mb-8">
                <p class="text-xs font-semibold opacity-80 tracking-wide">Saldo disponible ahora</p>
                <span class="text-xl opacity-90">🌿</span>
            </div>
            <h2 id="saldo-total" class="text-4xl font-extrabold mb-1 tracking-tight">$0.00</h2>
            <p class="text-[9px] opacity-70 uppercase tracking-[0.2em] mt-4 font-bold">Confía en tu proceso</p>
        </div>

        <div class="mb-10">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 ml-1">Nuevo Registro</p>
            <form id="form-transaccion" class="space-y-4">
                <input type="text" id="desc" placeholder="¿En qué fluyó el dinero?" class="input-zen" required>
                <div class="flex gap-3">
                    <input type="number" id="monto" step="0.01" placeholder="Monto $" class="input-zen font-bold" required>
                    <select id="tipo" class="input-zen w-1/3 font-bold bg-[#f3f2ff]">
                        <option value="egreso">Gasto</option>
                        <option value="ingreso">Sueldo</option>
                    </select>
                </div>
                <button type="submit" class="btn-zen-primary">Añadir con Calma</button>
            </form>
        </div>

        <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 ml-1">Movimientos de hoy</h3>
        <div id="tabla-movimientos" class="space-y-4"></div>
    </div>

    <!-- VISTA 2: DEUDAS -->
    <div id="view-deudas" class="view-content hidden max-w-md mx-auto px-6 pt-10 fade-in">
        <h1 class="text-xl font-extrabold mb-2">Tus Compromisos 🕊️</h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-8">Poco a poco, todo se libera</p>
        
        <div class="zen-card p-8 mb-10 bg-[#fffafa] border-pink-50">
            <p class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-tighter">Total por liberar</p>
            <h2 id="total-deuda-num" class="text-4xl font-black text-rose-400 tracking-tighter">$0.00</h2>
        </div>

        <div class="mb-10">
            <form id="form-deuda" class="space-y-4">
                <input type="text" id="deuda-desc" placeholder="Nombre (ej. Banco)" class="input-zen" required>
                <div class="flex gap-3">
                    <input type="number" id="deuda-monto" step="0.01" placeholder="Monto $" class="input-zen font-bold" required>
                    <select id="deuda-tipo" class="input-zen font-bold bg-[#f3f2ff]">
                        <option value="deuda">Es Deuda</option>
                        <option value="abono">Es Pago</option>
                    </select>
                </div>
                <button type="submit" class="btn-zen-primary" style="background-color: #f472b6; box-shadow: 0 10px 20px -5px rgba(244, 114, 182, 0.3);">Actualizar Cuenta</button>
            </form>
        </div>

        <div id="lista-deudas" class="space-y-4"></div>
    </div>

    <!-- VISTA 3: GASTOS FIJOS -->
    <div id="view-plan" class="view-content hidden max-w-md mx-auto px-6 pt-10 fade-in">
        <h1 class="text-xl font-extrabold mb-2">Presupuesto ☁️</h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-8">Tu seguridad mensual</p>

        <div class="mb-10">
            <form id="form-fijo" class="flex gap-3">
                <input type="text" id="fijo-desc" placeholder="Servicio" class="input-zen flex-1" required>
                <input type="number" id="fijo-monto" step="0.01" placeholder="$" class="input-zen w-24 font-bold" required>
                <button type="submit" class="w-14 bg-indigo-400 text-white rounded-2xl text-xl font-bold">+</button>
            </form>
        </div>

        <div id="lista-fijos-container" class="space-y-4 mb-10"></div>

        <div class="zen-card p-8 bg-slate-800 text-white shadow-2xl shadow-slate-200">
            <p class="text-[10px] font-bold uppercase tracking-[0.2em] opacity-50 mb-2 text-indigo-200">Meta del Mes</p>
            <h3 id="total-fijos-num" class="text-4xl font-black">$0.00</h3>
        </div>
    </div>

    <!-- NAVEGACIÓN SERENIDAD -->
    <nav class="fixed bottom-0 inset-x-0 bg-white/80 backdrop-blur-xl border-t border-lavender-soft h-24 flex justify-around items-center px-8 z-50">
        <button onclick="switchView('resumen')" id="nav-resumen" class="nav-item active">
            <span class="text-2xl">🌱</span>
            <span class="mt-1">DIARIO</span>
            <div class="nav-indicator mt-2"></div>
        </button>
        <button onclick="switchView('deudas')" id="nav-deudas" class="nav-item">
            <span class="text-2xl">🕊️</span>
            <span class="mt-1">DEUDAS</span>
            <div class="nav-indicator mt-2"></div>
        </button>
        <button onclick="switchView('plan')" id="nav-plan" class="nav-item">
            <span class="text-2xl">☁️</span>
            <span class="mt-1">FIJOS</span>
            <div class="nav-indicator mt-2"></div>
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRFAaPl2d1ZTy_ZE6uZEpHrffr63MN5Qc",
            authDomain: "mis-finanzas-hogar-8a7b8.firebaseapp.com",
            projectId: "mis-finanzas-hogar-8a7b8",
            storageBucket: "mis-finanzas-hogar-8a7b8.firebasestorage.app",
            messagingSenderId: "573199459213",
            appId: "1:573199459213:web:123f617fbc52874b7493c4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Variables para exportar
        let globalTrans = [];

        window.switchView = (view) => {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(`view-${view}`).classList.remove('hidden');
            document.getElementById(`nav-${view}`).classList.add('active');
        };

        window.eliminar = async (id, col) => {
            await deleteDoc(doc(db, col, id));
        };

        // --- EXPORTAR EXCEL ---
        window.exportarExcel = async () => {
            const data = globalTrans.map(t => ({
                Fecha: new Date(t.fecha).toLocaleDateString(),
                Descripción: t.desc,
                Tipo: t.tipo === 'egreso' ? 'Gasto' : 'Ingreso',
                Monto: t.monto
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Movimientos");
            XLSX.writeFile(wb, `Finanzas_Sullybec_${new Date().toLocaleDateString()}.xlsx`);
        };

        // --- IMPORTAR EXCEL ---
        window.importarExcel = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async (event) => {
                const bstr = event.target.result;
                const wb = XLSX.read(bstr, { type: 'binary' });
                const wsname = wb.SheetNames[0];
                const ws = wb.Sheets[wsname];
                const data = XLSX.utils.sheet_to_json(ws);

                for (const item of data) {
                    await addDoc(collection(db, "transacciones"), {
                        desc: item.Descripción || "Importado",
                        monto: Number(item.Monto) || 0,
                        tipo: item.Tipo === 'Ingreso' ? 'ingreso' : 'egreso',
                        fecha: new Date().toISOString()
                    });
                }
            };
            reader.readAsBinaryString(file);
        };

        // --- LÓGICA DE RESUMEN ---
        const formTrans = document.getElementById('form-transaccion');
        formTrans.addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "transacciones"), {
                desc: document.getElementById('desc').value,
                monto: Number(document.getElementById('monto').value),
                tipo: document.getElementById('tipo').value,
                fecha: new Date().toISOString()
            });
            formTrans.reset();
        });

        onSnapshot(query(collection(db, "transacciones"), orderBy("fecha", "desc")), (snap) => {
            let html = ""; let bal = 0; globalTrans = [];
            snap.forEach(d => {
                const item = d.data();
                globalTrans.push(item);
                if(item.tipo === 'egreso') bal -= item.monto;
                else bal += item.monto;

                html += `
                <div class="zen-card p-5 flex justify-between items-center fade-in">
                    <div class="flex gap-4 items-center">
                        <div class="w-12 h-12 rounded-2xl ${item.tipo==='egreso'?'bg-rose-50 text-rose-300':'bg-emerald-50 text-emerald-300'} flex items-center justify-center text-xl">
                            ${item.tipo==='egreso'?'🌸':'🍃'}
                        </div>
                        <div>
                            <p class="font-bold text-sm text-slate-600">${item.desc}</p>
                            <p class="text-[10px] text-slate-300 font-bold uppercase tracking-widest">${new Date(item.fecha).toLocaleDateString()}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-black text-sm ${item.tipo==='egreso'?'text-rose-400':'text-emerald-500'}">
                            ${item.tipo==='egreso'?'-':'+'}$${item.monto.toLocaleString('es-MX')}
                        </span>
                        <button onclick="window.eliminar('${d.id}', 'transacciones')" class="btn-delete">✕</button>
                    </div>
                </div>`;
            });
            document.getElementById('saldo-total').innerText = `$${bal.toLocaleString('es-MX', {minimumFractionDigits:2})}`;
            document.getElementById('tabla-movimientos').innerHTML = html;
        });

        // --- LÓGICA DE DEUDAS ---
        const formDeuda = document.getElementById('form-deuda');
        formDeuda.addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "deudasNuevas"), {
                desc: document.getElementById('deuda-desc').value,
                monto: Number(document.getElementById('deuda-monto').value),
                tipo: document.getElementById('deuda-tipo').value,
                fecha: new Date().toISOString()
            });
            formDeuda.reset();
        });

        onSnapshot(query(collection(db, "deudasNuevas"), orderBy("fecha", "desc")), (snap) => {
            let totalD = 0; let html = "";
            snap.forEach(d => {
                const item = d.data();
                if(item.tipo === 'deuda') totalD += item.monto;
                else totalD -= item.monto;

                html += `
                <div class="zen-card p-5 flex justify-between items-center border-l-8 ${item.tipo==='deuda'?'border-l-rose-200':'border-l-indigo-200'}">
                    <div>
                        <p class="font-bold text-sm text-slate-600">${item.desc}</p>
                        <p class="text-[9px] font-black text-slate-300 uppercase tracking-widest">${item.tipo==='deuda'?'En proceso':'Pagado'}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-black text-sm text-slate-500">$${item.monto.toLocaleString('es-MX')}</span>
                        <button onclick="window.eliminar('${d.id}', 'deudasNuevas')" class="btn-delete">✕</button>
                    </div>
                </div>`;
            });
            document.getElementById('total-deuda-num').innerText = `$${totalD.toLocaleString('es-MX', {minimumFractionDigits:2})}`;
            document.getElementById('lista-deudas').innerHTML = html;
        });

        // --- LÓGICA DE FIJOS ---
        const formFijo = document.getElementById('form-fijo');
        formFijo.addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "gastosFijos"), {
                desc: document.getElementById('fijo-desc').value,
                monto: Number(document.getElementById('fijo-monto').value)
            });
            formFijo.reset();
        });

        onSnapshot(collection(db, "gastosFijos"), (snap) => {
            let total = 0; let html = "";
            snap.forEach(d => {
                const item = d.data();
                total += item.monto;
                html += `
                <div class="zen-card p-5 flex justify-between items-center shadow-sm">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">☀️</span>
                        <span class="font-bold text-sm text-slate-500">${item.desc}</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="font-black text-sm text-indigo-400">$${item.monto.toLocaleString('es-MX')}</span>
                        <button onclick="window.eliminar('${d.id}', 'gastosFijos')" class="btn-delete">✕</button>
                    </div>
                </div>`;
            });
            document.getElementById('lista-fijos-container').innerHTML = html;
            document.getElementById('total-fijos-num').innerText = `$${total.toLocaleString('es-MX', {minimumFractionDigits:2})}`;
        });

    </script>
</body>
</html>
